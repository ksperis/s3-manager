site_name: s3-manager Documentation
site_description: Explore and manage S3-compatible object storage with IAM-aligned workflows.
site_author: s3-manager contributors
repo_name: s3-manager
repo_url: https://github.com/ksperis/s3-manager
edit_uri: edit/main/doc/docs/
site_url: https://ksperis.github.io/s3-manager/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true

extra_css:
  - assets/stylesheets/docs-theme.css
  - assets/stylesheets/screenshots-gallery.css

extra_javascript:
  - assets/javascripts/screenshots-gallery.js


# Defaults target promoted GHCR images.
# For lab/dev, override BUCKETREEF_BACKEND_IMAGE and BUCKETREEF_FRONTEND_IMAGE
# with GitLab Container Registry image names and set BUCKETREEF_TAG to dev or
# dev-<short-sha>.
name: bucketreef

services:
  backend:
    image: ${BUCKETREEF_BACKEND_IMAGE:-ghcr.io/ksperis/bucketreef-backend}:${BUCKETREEF_TAG:-latest}
    environment:
      APP_ENV: ${APP_ENV:-development}
      UI_JWT_KEYS: '${UI_JWT_KEYS:-["change-me"]}'
      API_JWT_KEYS: '${API_JWT_KEYS:-["change-me"]}'
      CREDENTIAL_KEYS: '${CREDENTIAL_KEYS:-["change-me"]}'
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://127.0.0.1:8080", "http://localhost:8080"]}'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8080}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost", "127.0.0.1", "backend"]}'
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-[]}'
      USER_SUPPLIED_S3_ENDPOINT_ALLOWED_HOSTS: '${USER_SUPPLIED_S3_ENDPOINT_ALLOWED_HOSTS:-[]}'
      BUCKET_MIGRATION_WEBHOOK_ALLOWED_HOSTS: '${BUCKET_MIGRATION_WEBHOOK_ALLOWED_HOSTS:-[]}'
      BUCKET_MIGRATION_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${BUCKET_MIGRATION_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-false}
      REQUIRE_REGISTERED_S3_LOGIN_ENDPOINTS: ${REQUIRE_REGISTERED_S3_LOGIN_ENDPOINTS:-false}
      DATABASE_URL: sqlite:////data/app.db
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:?INTERNAL_CRON_TOKEN must be set}
      BILLING_DAILY_RETENTION_DAYS: ${BILLING_DAILY_RETENTION_DAYS:-365}
      QUOTA_HISTORY_HOURLY_RETENTION_DAYS: ${QUOTA_HISTORY_HOURLY_RETENTION_DAYS:-30}
      QUOTA_HISTORY_DAILY_RETENTION_DAYS: ${QUOTA_HISTORY_DAILY_RETENTION_DAYS:-365}
      USER_NOTIFICATIONS_RETENTION_DAYS: ${USER_NOTIFICATIONS_RETENTION_DAYS:-90}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - backend-data:/data
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${BUCKETREEF_BIND_ADDRESS:-127.0.0.1}:${BUCKETREEF_BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
  frontend:
    image: ${BUCKETREEF_FRONTEND_IMAGE:-ghcr.io/ksperis/bucketreef-frontend}:${BUCKETREEF_TAG:-latest}
    ports:
      - "${BUCKETREEF_BIND_ADDRESS:-127.0.0.1}:${BUCKETREEF_FRONTEND_PORT:-8080}:8080"
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CSP_CONNECT_SRC: "${CSP_CONNECT_SRC:-'self'}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/setup/first-admin || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
  scheduler:
    image: ${BUCKETREEF_SCHEDULER_IMAGE:-ghcr.io/ksperis/bucketreef-scheduler}:${BUCKETREEF_TAG:-latest}
    profiles: ["operations"]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_BASE: ${BACKEND_API_BASE:-http://backend:8000/api}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:?INTERNAL_CRON_TOKEN must be set}
      HEALTHCHECK_CRON_SCHEDULE: ${HEALTHCHECK_CRON_SCHEDULE:-*/5 * * * *}
      BILLING_CRON_SCHEDULE: ${BILLING_CRON_SCHEDULE:-0 2 * * *}
      QUOTA_MONITOR_CRON_SCHEDULE: ${QUOTA_MONITOR_CRON_SCHEDULE:-0 * * * *}
      USAGE_HISTORY_CRON_SCHEDULE: ${USAGE_HISTORY_CRON_SCHEDULE:-0 3 * * *}
      NOTIFICATION_RETENTION_CRON_SCHEDULE: ${NOTIFICATION_RETENTION_CRON_SCHEDULE:-15 3 * * *}
      BILLING_DAY_OFFSET: ${BILLING_DAY_OFFSET:-1}
      CRON_HTTP_TIMEOUT_SECONDS: ${CRON_HTTP_TIMEOUT_SECONDS:-30}
      TZ: ${TZ:-UTC}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  backend-data:

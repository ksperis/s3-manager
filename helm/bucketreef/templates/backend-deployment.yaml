{{- $backendReplicas := int (.Values.backend.replicas | default 1) -}}
{{- $backendAccessMode := lower (toString (.Values.backend.persistence.accessMode | default "ReadWriteOnce")) -}}
{{- if not .Values.backend.existingSecret -}}
{{- fail "backend.existingSecret is required and must reference an existing authentication secret." -}}
{{- end -}}
{{- if not .Values.ingress.enabled -}}
{{- fail "ingress.enabled=true is required for the production security profile." -}}
{{- end -}}
{{- if not .Values.ingress.tls -}}
{{- fail "ingress.tls must reference an existing TLS secret." -}}
{{- end -}}
{{- if not .Values.backend.trustedProxyCidrs -}}
{{- fail "backend.trustedProxyCidrs is required and must contain the exact ingress/reverse-proxy CIDR boundary." -}}
{{- end -}}
{{- range $secretName := list "DATABASE_URL" "UI_JWT_KEYS" "API_JWT_KEYS" "CREDENTIAL_KEYS" "INTERNAL_CRON_TOKEN" "SMTP_PASSWORD" -}}
{{- if hasKey $.Values.backend.env $secretName -}}
{{- fail (printf "%s must be supplied through backend.existingSecret, not backend.env." $secretName) -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values.backend.env "TRUSTED_PROXY_CIDRS" -}}
{{- fail "TRUSTED_PROXY_CIDRS must be configured with backend.trustedProxyCidrs, not backend.env." -}}
{{- end -}}
{{- if and (gt $backendReplicas 1) (ne (lower .Values.backend.databaseType) "postgresql") -}}
{{- fail "backend.replicas > 1 requires backend.databaseType=postgresql." -}}
{{- end -}}
{{- if and (gt $backendReplicas 1) .Values.backend.persistence.enabled (ne $backendAccessMode "readwritemany") -}}
{{- fail "backend.replicas > 1 cannot use backend.persistence with ReadWriteOnce; disable backend.persistence.enabled or set backend.persistence.accessMode=ReadWriteMany." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bucketreef.fullname" . }}-backend
  labels:
    {{- include "bucketreef.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "bucketreef.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.backend.trustedProxyCidrs | toJson | quote }}
            {{- if not (hasKey .Values.backend.env "BACKEND_REPLICAS") }}
            - name: BACKEND_REPLICAS
              value: {{ .Values.backend.replicas | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.databaseUrl | quote }}
            - name: UI_JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.uiJwtKeys | quote }}
            - name: API_JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.apiJwtKeys | quote }}
            - name: CREDENTIAL_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.credentialKeys | quote }}
            - name: INTERNAL_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.internalCronToken | quote }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.smtpPassword | quote }}
                  optional: true
            {{- range .Values.backend.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "bucketreef.fullname" . }}-backend
      {{- end }}

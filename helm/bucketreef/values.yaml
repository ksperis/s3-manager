image:
  backend:
    repository: ghcr.io/ksperis/bucketreef-backend
    tag: "0.2.3"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/ksperis/bucketreef-frontend
    tag: "0.2.3"
    pullPolicy: IfNotPresent

backend:
  replicas: 1
  databaseType: postgresql
  # Exact ingress/reverse-proxy pod CIDRs. Required by the production profile.
  trustedProxyCidrs: []
  # Existing Secret is mandatory. It must contain database-url, ui-jwt-keys,
  # api-jwt-keys, credential-keys and internal-cron-token.
  existingSecret: ""
  secretKeys:
    databaseUrl: database-url
    uiJwtKeys: ui-jwt-keys
    apiJwtKeys: api-jwt-keys
    credentialKeys: credential-keys
    internalCronToken: internal-cron-token
    smtpPassword: smtp-password
  env:
    APP_ENV: production
    API_V1_PREFIX: /api
    PUBLIC_ORIGIN: https://bucketreef.local
    CORS_ORIGINS: '["https://bucketreef.local"]'
    ALLOWED_HOSTS: '["bucketreef.local"]'
    USER_SUPPLIED_S3_ENDPOINT_ALLOWED_HOSTS: '[]'
    BUCKET_MIGRATION_WEBHOOK_ALLOWED_HOSTS: '[]'
    BUCKET_MIGRATION_WEBHOOK_ALLOW_PRIVATE_TARGETS: "false"
    REFRESH_TOKEN_COOKIE_SECURE: "true"
    REQUIRE_REGISTERED_S3_LOGIN_ENDPOINTS: "true"
    WEBAUTHN_ORIGIN: https://bucketreef.local
    WEBAUTHN_RP_ID: bucketreef.local
    # No implicit storage seed is created in production. Configure endpoints
    # administratively after startup or provide an explicit HTTPS seed.
    APP_SETTINGS_PATH: /data/app_settings.json
    BILLING_DAILY_RETENTION_DAYS: "365"
    QUOTA_HISTORY_HOURLY_RETENTION_DAYS: "30"
    QUOTA_HISTORY_DAILY_RETENTION_DAYS: "365"
    USER_NOTIFICATIONS_RETENTION_DAYS: "90"
  extraEnv: []
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicas: 1
  env:
    CSP_CONNECT_SRC: "'self'"
  extraEnv: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 80

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: bucketreef
    password: ""
    database: bucketreef
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

cronJobs:
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# The strict profile is intentionally fail-closed. Operators must identify the
# real ingress and DNS pods and explicitly declare permitted outbound networks.
networkPolicy:
  strict: true
  ingressController:
    namespaceSelector:
      matchLabels: {}
    podSelector:
      matchLabels: {}
  dns:
    namespaceSelector:
      matchLabels: {}
    podSelector:
      matchLabels: {}
  publicHttpsEgress: []
  privateEgress: []

ingress:
  enabled: true
  className: ""
  annotations: {}
  host: bucketreef.local
  tls:
    - secretName: bucketreef-tls
      hosts:
        - bucketreef.local

billingCronJob:
  enabled: false
  schedule: "0 2 * * *"
  dayOffset: 1
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

healthcheckCronJob:
  enabled: false
  schedule: "*/5 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

quotaMonitorCronJob:
  enabled: false
  schedule: "0 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

usageHistoryCronJob:
  enabled: false
  schedule: "0 3 * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

notificationRetentionCronJob:
  enabled: false
  schedule: "15 3 * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

nameOverride: ""
fullnameOverride: ""

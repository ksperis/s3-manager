image:
  backend:
    repository: ghcr.io/ksperis/s3-manager-backend
    tag: "0.1.11"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/ksperis/s3-manager-frontend
    tag: "0.1.11"
    pullPolicy: IfNotPresent

backend:
  replicas: 1
  databaseType: postgresql
  # Existing Secret is mandatory. It must contain database-url, ui-jwt-keys,
  # api-jwt-keys, credential-keys and internal-cron-token.
  existingSecret: ""
  secretKeys:
    databaseUrl: database-url
    uiJwtKeys: ui-jwt-keys
    apiJwtKeys: api-jwt-keys
    credentialKeys: credential-keys
    internalCronToken: internal-cron-token
    smtpPassword: smtp-password
  env:
    APP_ENV: production
    API_V1_PREFIX: /api
    PUBLIC_ORIGIN: https://s3-manager.local
    CORS_ORIGINS: '["https://s3-manager.local"]'
    ALLOWED_HOSTS: '["s3-manager.local"]'
    REFRESH_TOKEN_COOKIE_SECURE: "true"
    REQUIRE_REGISTERED_S3_LOGIN_ENDPOINTS: "true"
    SEED_SUPER_ADMIN_MODE: disabled
    WEBAUTHN_ORIGIN: https://s3-manager.local
    WEBAUTHN_RP_ID: s3-manager.local
    # No implicit storage seed is created in production. Configure endpoints
    # administratively after startup or provide an explicit HTTPS seed.
    APP_SETTINGS_PATH: /data/app_settings.json
    BILLING_DAILY_RETENTION_DAYS: "365"
    QUOTA_HISTORY_HOURLY_RETENTION_DAYS: "30"
    QUOTA_HISTORY_DAILY_RETENTION_DAYS: "365"
  extraEnv: []
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

frontend:
  replicas: 1
  env:
    CSP_CONNECT_SRC: "'self'"
  extraEnv: []

service:
  backend:
    type: ClusterIP
    port: 8000
  frontend:
    type: ClusterIP
    port: 80

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: s3manager
    password: ""
    database: s3manager
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

ingress:
  enabled: true
  className: ""
  annotations: {}
  host: s3-manager.local
  tls:
    - secretName: s3-manager-tls
      hosts:
        - s3-manager.local

billingCronJob:
  enabled: false
  schedule: "0 2 * * *"
  dayOffset: 1
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

healthcheckCronJob:
  enabled: false
  schedule: "*/5 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

quotaMonitorCronJob:
  enabled: false
  schedule: "0 * * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

usageHistoryCronJob:
  enabled: false
  schedule: "0 3 * * *"
  backoffLimit: 1
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  extraEnv: []

nameOverride: ""
fullnameOverride: ""

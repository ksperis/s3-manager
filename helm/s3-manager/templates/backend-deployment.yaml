{{- $backendReplicas := int (.Values.backend.replicas | default 1) -}}
{{- $databaseURL := lower (toString (get .Values.backend.env "DATABASE_URL" | default "")) -}}
{{- $backendAccessMode := lower (toString (.Values.backend.persistence.accessMode | default "ReadWriteOnce")) -}}
{{- if and (gt $backendReplicas 1) (not (or .Values.postgresql.enabled (hasPrefix "postgres" $databaseURL))) -}}
{{- fail "backend.replicas > 1 requires PostgreSQL; enable postgresql or set backend.env.DATABASE_URL to a PostgreSQL URL." -}}
{{- end -}}
{{- if and (gt $backendReplicas 1) .Values.backend.persistence.enabled (ne $backendAccessMode "readwritemany") -}}
{{- fail "backend.replicas > 1 cannot use backend.persistence with ReadWriteOnce; disable backend.persistence.enabled or set backend.persistence.accessMode=ReadWriteMany." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "s3-manager.fullname" . }}-backend
  labels:
    {{- include "s3-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "s3-manager.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not (hasKey .Values.backend.env "BACKEND_REPLICAS") }}
            - name: BACKEND_REPLICAS
              value: {{ .Values.backend.replicas | quote }}
            {{- end }}
            {{- if and .Values.billingCronJob.internalToken (not (hasKey .Values.backend.env "INTERNAL_CRON_TOKEN")) }}
            - name: INTERNAL_CRON_TOKEN
              value: {{ .Values.billingCronJob.internalToken | quote }}
            {{- end }}
            {{- if and .Values.postgresql.enabled (not (hasKey .Values.backend.env "DATABASE_URL")) }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "s3-manager.fullname" . }}-postgresql
                  key: database-url
            {{- end }}
            {{- if and (not .Values.postgresql.enabled) (not (hasKey .Values.backend.env "DATABASE_URL")) }}
            - name: DATABASE_URL
              value: "sqlite:////data/app.db"
            {{- end }}
            {{- range .Values.backend.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- if .Values.backend.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- if .Values.backend.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "s3-manager.fullname" . }}-backend
      {{- end }}

    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -f scheduler/Dockerfile -t "$CI_REGISTRY_IMAGE/scheduler:$CI_COMMIT_SHA" .
    - test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id "$CI_REGISTRY_IMAGE/scheduler:$CI_COMMIT_SHA" -u)" = "10001"
    - docker push "$CI_REGISTRY_IMAGE/scheduler:$CI_COMMIT_SHA"

helm-kind-onboarding-smoke:
  stage: security
  image: docker:27-cli
  services:
    - docker:27-dind
  needs:
    - build-backend
    - build-frontend
  variables:
    KIND_VERSION: v0.27.0
    KIND_API_HOST: docker
    KIND_SMOKE_PRUNE_SOURCE_IMAGES: "true"
    BACKEND_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/backend"
    FRONTEND_IMAGE_REPOSITORY: "$CI_REGISTRY_IMAGE/frontend"
    IMAGE_TAG: "$CI_COMMIT_SHA"
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash curl helm jq kubectl openssl
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - curl --fail --silent --show-error --location --output /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
    - curl --fail --silent --show-error --location --output /tmp/kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
    - echo "$(awk '{print $1}' /tmp/kind.sha256sum)  /tmp/kind" | sha256sum -c
    - install -m 0755 /tmp/kind /usr/local/bin/kind
  script:
    - bash ops/ci/kind-onboarding-smoke.sh

release-source-images-ready:
  stage: build
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  needs:
    - job: release-tag-metadata
      artifacts: true
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never
  variables:
    RELEASE_SOURCE_IMAGE_RETRIES: "60"
    RELEASE_SOURCE_IMAGE_RETRY_SECONDS: "30"
  script:
    - |
      for source_image in "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/scheduler:$CI_COMMIT_SHA"; do
        attempt=1
        while [ "$attempt" -le "$RELEASE_SOURCE_IMAGE_RETRIES" ]; do
          if skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$source_image" >/dev/null 2>&1; then
            echo "Release source image is ready: $source_image"
            break
          fi

          if [ "$attempt" -eq "$RELEASE_SOURCE_IMAGE_RETRIES" ]; then
            echo "Release source image is not available: $source_image"
            echo "Ensure the main pipeline built and pushed this commit before creating or rerunning the release tag."
            exit 1
          fi

          echo "Waiting for release source image: $source_image ($attempt/$RELEASE_SOURCE_IMAGE_RETRIES)"
          sleep "$RELEASE_SOURCE_IMAGE_RETRY_SECONDS"
          attempt=$((attempt + 1))
        done
      done

secret_detection:
  stage: security
  allow_failure: false
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: on_success
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never

backend-image-vuln-scan:
  extends: .trivy-job
  stage: security
  needs:
    - build-backend
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - |
      trivy image \
        --scanners vuln \
        --pkg-types os,library \
        --exit-code 1 \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --username "$TRIVY_USERNAME" \
        --password "$TRIVY_PASSWORD" \
        --format json \
        --output gl-security-reports/backend-image-trivy.json \
        "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" || scan_exit=$?
    - |
      trivy image \
        --username "$TRIVY_USERNAME" \
        --password "$TRIVY_PASSWORD" \
        --format cyclonedx \
        --output gl-security-reports/backend-image-sbom.cdx.json \
        "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - |
      trivy image \
        --scanners vuln \
        --pkg-types os,library \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --username "$TRIVY_USERNAME" \
        --password "$TRIVY_PASSWORD" \
        --format table \
        "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    - test -z "${scan_exit:-}"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-security-reports/backend-image-trivy.json
      - gl-security-reports/backend-image-sbom.cdx.json


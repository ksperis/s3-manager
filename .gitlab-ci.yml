    - |
      trivy fs \
        --scanners vuln \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --format table \
        frontend
    - test -z "${scan_exit:-}"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-security-reports/frontend-dependencies-trivy.json
      - gl-security-reports/frontend-sbom.cdx.json

ceph-functional-tests:
  stage: test
  image: python:3.12-slim
  needs: []
  allow_failure: true
  retry: 0
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - if: '$CEPH_TEST_LAB_S3_ENDPOINT && $CEPH_TEST_RGW_ADMIN_ENDPOINT && $CEPH_TEST_RGW_ADMIN_ACCESS_KEY && $CEPH_TEST_RGW_ADMIN_SECRET_KEY && $CEPH_TEST_SUPERVISION_ACCESS_KEY && $CEPH_TEST_SUPERVISION_SECRET_KEY && $CEPH_TEST_CEPH_ADMIN_ACCESS_KEY && $CEPH_TEST_CEPH_ADMIN_SECRET_KEY'
      when: on_success
    - when: never
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-test.txt
    - mkdir -p gl-test-reports
  script:
    - cd backend
    - PYTHONPATH=. python tests_ceph_functional/run_ci.py -q -ra --junit-xml=../gl-test-reports/ceph-functional-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-test-reports/ceph-functional-junit.xml
      - gl-test-reports/ceph-functional-backend.log
    reports:
      junit: gl-test-reports/ceph-functional-junit.xml

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" backend
    - docker run --rm --read-only --tmpfs /tmp --entrypoint python "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" -c "from pathlib import Path; import os, app.scripts.issue_first_admin_bootstrap; assert os.getuid() == 10001; assert Path('/app/alembic/versions/0119_first_admin_bootstrap.py').is_file()"
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg VITE_API_URL="$VITE_API_URL" -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" frontend
    - |
      smoke_container="$(docker run --detach --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA")"
      trap 'docker rm --force "$smoke_container" >/dev/null 2>&1 || true' EXIT
      for attempt in $(seq 1 30); do
        if docker exec "$smoke_container" wget -q -O /dev/null http://127.0.0.1:8080/setup/first-admin; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          docker logs "$smoke_container"
          exit 1
        fi
        sleep 1
      done
      docker exec "$smoke_container" grep -F "connect-src 'self'" /tmp/nginx.conf
      docker rm --force "$smoke_container" >/dev/null
      trap - EXIT
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"

build-scheduler:
  stage: build

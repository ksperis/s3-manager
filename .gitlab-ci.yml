    - when: on_success
  before_script:
    - mkdir -p gl-test-reports
  script:
    - cd frontend
    - npm ci
    - npm run test:ci
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-test-reports/frontend-junit.xml
    reports:
      junit: gl-test-reports/frontend-junit.xml

frontend-browser-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  variables:
    E2E_S3_ENDPOINT: http://localhost:5000
    E2E_S3_ACCESS_KEY: minio
    E2E_S3_SECRET_KEY: minio123
    E2E_START_MOTO: "true"
    E2E_MOTO_COMMAND: "../backend/.venv/bin/moto_server -H 0.0.0.0 -p 5000"
    S3_IGNORE_SUBDOMAIN_BUCKETNAME: "true"
  before_script:
    - mkdir -p gl-test-reports
    - rm -f backend/.env
    - for var in $(env | cut -d= -f1 | grep '^OIDC_PROVIDERS__' || true); do unset "$var"; done
    - export OIDC_PROVIDERS="{}"
    - |
      if ! command -v python3 >/dev/null 2>&1; then
        apt-get update
        apt-get install -y python3
      fi
      if ! python3 -m ensurepip --version >/dev/null 2>&1; then
        apt-get update
        PYTHON_VENV_PACKAGE="python$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')-venv"
        apt-get install -y "$PYTHON_VENV_PACKAGE"
      fi
    - rm -rf backend/.venv
    - python3 -m venv backend/.venv
    - backend/.venv/bin/python -m pip install --upgrade pip
    - backend/.venv/bin/python -m pip install -r backend/requirements-browser-e2e.txt
  script:
    - cd frontend
    - npm ci
    - npm run test:e2e:ci
  after_script:
    - mkdir -p gl-test-reports frontend/playwright-report frontend/test-results
    - touch frontend/playwright-report/.keep frontend/test-results/.keep
    - |
      if [ ! -f gl-test-reports/frontend-browser-e2e-junit.xml ]; then
        printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<testsuites />' > gl-test-reports/frontend-browser-e2e-junit.xml
      fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-test-reports/frontend-browser-e2e-junit.xml
      - frontend/playwright-report/
      - frontend/test-results/
    reports:
      junit: gl-test-reports/frontend-browser-e2e-junit.xml

frontend-vuln-scan:
  extends: .trivy-job
  stage: test
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  script:
    - |

        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --username "$TRIVY_USERNAME" \
        --password "$TRIVY_PASSWORD" \
        --format json \
        --output gl-security-reports/frontend-release-image-trivy.json \
        "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" || scan_exit=$?
    - |
      trivy image \
        --scanners vuln \
        --pkg-types os,library \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --username "$TRIVY_USERNAME" \
        --password "$TRIVY_PASSWORD" \
        --format table \
        "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    - test -z "${scan_exit:-}"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-security-reports/frontend-release-image-trivy.json

promote-backend-dev:
  extends: .promote-internal-image
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
      when: on_success
    - when: never
  variables:
    SOURCE_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    TARGET_GITLAB_IMAGE: "$CI_REGISTRY_IMAGE/backend"

promote-frontend-dev:
  extends: .promote-internal-image
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
      when: on_success
    - when: never
  variables:
    SOURCE_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    TARGET_GITLAB_IMAGE: "$CI_REGISTRY_IMAGE/frontend"

promote-backend-release:
  extends: .promote-public-image
  needs:
    - job: release-tag-metadata
      artifacts: true
    - backend-release-image-vuln-scan
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never
  variables:
    PROMOTION_KIND: "release"
    SOURCE_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
    TARGET_GHCR_IMAGE: "$GHCR_BACKEND_IMAGE"

promote-frontend-release:
  extends: .promote-public-image
  needs:
    - job: release-tag-metadata
      artifacts: true
    - frontend-release-image-vuln-scan
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never
  variables:
    PROMOTION_KIND: "release"
    SOURCE_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
    TARGET_GHCR_IMAGE: "$GHCR_FRONTEND_IMAGE"

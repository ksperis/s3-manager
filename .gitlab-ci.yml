    - cd backend
    - python scripts/check_vulture.py

backend-vuln-scan:
  extends: .trivy-job
  stage: test
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  script:
    - |
      trivy fs \
        --scanners vuln \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --format json \
        --output gl-security-reports/backend-dependencies-trivy.json \
        backend || scan_exit=$?
    - |
      trivy fs \
        --scanners vuln \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --format table \
        backend
    - test -z "${scan_exit:-}"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-security-reports/backend-dependencies-trivy.json


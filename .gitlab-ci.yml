build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --build-arg VITE_API_URL="$VITE_API_URL" -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"

release-source-images-ready:
  stage: build
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  needs:
    - job: release-tag-metadata
      artifacts: true
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never
  variables:
    RELEASE_SOURCE_IMAGE_RETRIES: "60"
    RELEASE_SOURCE_IMAGE_RETRY_SECONDS: "30"
  script:
    - |
      for source_image in "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"; do
        attempt=1
        while [ "$attempt" -le "$RELEASE_SOURCE_IMAGE_RETRIES" ]; do
          if skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$source_image" >/dev/null 2>&1; then
            echo "Release source image is ready: $source_image"
            break
          fi

          if [ "$attempt" -eq "$RELEASE_SOURCE_IMAGE_RETRIES" ]; then
            echo "Release source image is not available: $source_image"
            echo "Ensure the main pipeline built and pushed this commit before creating or rerunning the release tag."
            exit 1
          fi

          echo "Waiting for release source image: $source_image ($attempt/$RELEASE_SOURCE_IMAGE_RETRIES)"
          sleep "$RELEASE_SOURCE_IMAGE_RETRY_SECONDS"
          attempt=$((attempt + 1))
        done
      done

secret_detection:
  stage: security
  allow_failure: false
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: on_success
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never

backend-image-vuln-scan:
  extends: .trivy-job
  stage: security
  needs:
    - build-backend
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'

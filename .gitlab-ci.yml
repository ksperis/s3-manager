include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build
  - security
  - promote

default:
  retry:
    max: 1
    when:
      - script_failure
      - api_failure
      - runner_system_failure

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  VITE_API_URL: "/api"
  TRIVY_IMAGE: "aquasec/trivy:0.69.3"
  SKOPEO_IMAGE: "quay.io/skopeo/stable:latest"
  TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.trivycache"
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_TIMEOUT: "20m0s"
  TRIVY_NO_PROGRESS: "--no-progress"
  TRIVY_USERNAME: "$CI_REGISTRY_USER"
  TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  DEV_BRANCH: "dev"
  GHCR_REGISTRY: "ghcr.io"
  GHCR_NAMESPACE: "ksperis"
  GHCR_BACKEND_IMAGE: "ghcr.io/ksperis/bucketreef-backend"
  GHCR_FRONTEND_IMAGE: "ghcr.io/ksperis/bucketreef-frontend"
  GHCR_SCHEDULER_IMAGE: "ghcr.io/ksperis/bucketreef-scheduler"

.trivy-job:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  before_script:
    - trivy --version
    - mkdir -p gl-security-reports
  artifacts:
    when: always
    expire_in: 1 week

project-naming:
  stage: test
  image: python:3.12-slim
  needs: []
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  script:
    - python backend/scripts/check_project_naming.py

helm-contract:
  stage: test
  image:
    name: alpine/helm:3.18.6
    entrypoint: [""]
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  script:
    - helm lint helm/bucketreef -f ops/ci/helm-secure-values.yaml --set backend.existingSecret=bucketreef-auth
    - if helm template bucketreef helm/bucketreef --set backend.existingSecret=bucketreef-auth --set networkPolicy.strict=false > /tmp/bucketreef-invalid.yaml 2>/tmp/bucketreef-invalid.err; then echo "expected missing trusted proxy CIDRs to fail"; exit 1; fi
    - grep -q 'backend.trustedProxyCidrs is required' /tmp/bucketreef-invalid.err
    - if helm template bucketreef helm/bucketreef --set backend.existingSecret=bucketreef-auth --set-json 'backend.trustedProxyCidrs=["10.42.0.0/16"]' > /tmp/bucketreef-network-invalid.yaml 2>/tmp/bucketreef-network-invalid.err; then echo "expected missing strict NetworkPolicy selectors to fail"; exit 1; fi
    - grep -q 'networkPolicy.ingressController.namespaceSelector.matchLabels is required' /tmp/bucketreef-network-invalid.err
    - helm template bucketreef helm/bucketreef -f ops/ci/helm-secure-values.yaml --set backend.existingSecret=bucketreef-auth > /tmp/bucketreef-rendered.yaml
    - test -s /tmp/bucketreef-rendered.yaml
    - "grep -q 'name: TRUSTED_PROXY_CIDRS' /tmp/bucketreef-rendered.yaml"
    - grep -Fq '[\"10.244.0.0/16\"]' /tmp/bucketreef-rendered.yaml
    - grep -q 'ghcr.io/ksperis/bucketreef-backend:0.2.3' /tmp/bucketreef-rendered.yaml
    - grep -q 'ghcr.io/ksperis/bucketreef-frontend:0.2.3' /tmp/bucketreef-rendered.yaml
    - "grep -q 'kind: NetworkPolicy' /tmp/bucketreef-rendered.yaml"
    - "grep -q 'readOnlyRootFilesystem: true' /tmp/bucketreef-rendered.yaml"
    - "grep -q 'automountServiceAccountToken: false' /tmp/bucketreef-rendered.yaml"
    - helm template bucketreef helm/bucketreef -f ops/ci/helm-secure-values.yaml --set backend.existingSecret=bucketreef-auth --set backend.replicas=2 --set backend.persistence.enabled=false > /tmp/bucketreef-multi-backend.yaml
    - test -s /tmp/bucketreef-multi-backend.yaml
    - helm template bucketreef helm/bucketreef -f ops/ci/helm-secure-values.yaml --set backend.existingSecret=bucketreef-auth --set-string image.backend.repository="$CI_REGISTRY_IMAGE/backend" --set-string image.backend.tag="$CI_COMMIT_SHA" --set-string image.frontend.repository="$CI_REGISTRY_IMAGE/frontend" --set-string image.frontend.tag="$CI_COMMIT_SHA" > /tmp/bucketreef-commit-images.yaml
    - grep -q "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" /tmp/bucketreef-commit-images.yaml
    - grep -q "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" /tmp/bucketreef-commit-images.yaml

compose-contract:
  stage: test
  image: docker:27-cli
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  before_script:
    - apk add --no-cache jq
  script:
    - docker compose version
    - |
      for compose_file in docker-compose.yml docker-compose.build.yml; do
        rendered="$(INTERNAL_CRON_TOKEN=test docker compose --profile operations --file "$compose_file" config --format json)"
        test "$(printf '%s' "$rendered" | jq -r '.services.frontend.environment.CSP_CONNECT_SRC')" = "'self'"
        printf '%s' "$rendered" | jq -e '.services.backend.healthcheck.test and .services.frontend.healthcheck.test' >/dev/null
        printf '%s' "$rendered" | jq -e '.services.backend.read_only and .services.frontend.read_only and .services.scheduler.read_only' >/dev/null
        test "$(printf '%s' "$rendered" | jq -r '.services.frontend.ports[0].target')" = "8080"
        test "$(printf '%s' "$rendered" | jq -r '.services.scheduler.user')" = "10001:10001"
      done

.promote-internal-image:
  stage: promote
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  script:
    - test -n "$SOURCE_IMAGE"
    - test -n "$TARGET_GITLAB_IMAGE"
    - |
      source_digest=$(skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" --format '{{.Digest}}' "docker://$SOURCE_IMAGE")
      for tag in dev "dev-$CI_COMMIT_SHORT_SHA"; do
        gitlab_target="docker://$TARGET_GITLAB_IMAGE:$tag"

        skopeo copy \
          --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          "docker://$SOURCE_IMAGE" \
          "$gitlab_target"

        gitlab_digest=$(skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" --format '{{.Digest}}' "$gitlab_target")
        test "$gitlab_digest" = "$source_digest"
      done

.promote-public-image:
  stage: promote
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  script:
    - test -n "$SOURCE_IMAGE"
    - test -n "$TARGET_GHCR_IMAGE"
    - test -n "$GHCR_USERNAME"
    - test -n "$GHCR_TOKEN"
    - test -n "$RELEASE_GHCR_TAGS"
    - |
      if [ "$PROMOTION_KIND" != "release" ]; then
        echo "Unsupported PROMOTION_KIND: $PROMOTION_KIND"
        exit 1
      fi
      promotion_tags="$(printf '%s' "$RELEASE_GHCR_TAGS" | tr ',' ' ')"
      if [ -z "$promotion_tags" ]; then
        echo "Release promotion requires at least one GHCR tag"
        exit 1
      fi
    - |
      source_digest=$(skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" --format '{{.Digest}}' "docker://$SOURCE_IMAGE")
      for tag in $promotion_tags; do
        ghcr_target="docker://$TARGET_GHCR_IMAGE:$tag"

        skopeo copy \
          --src-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" \
          --dest-creds "$GHCR_USERNAME:$GHCR_TOKEN" \
          "docker://$SOURCE_IMAGE" \
          "$ghcr_target"

        ghcr_digest=$(skopeo inspect --creds "$GHCR_USERNAME:$GHCR_TOKEN" --format '{{.Digest}}' "$ghcr_target")
        test "$ghcr_digest" = "$source_digest"
      done

release-tag-metadata:
  stage: test
  image: alpine:3.20
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache coreutils git
  script:
    - |
      release_tag="${CI_COMMIT_TAG:-}"
      if ! printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Release tag must match vX.Y.Z"
        exit 1
      fi

      release_version="${release_tag#v}"
      release_minor="${release_version%.*}"
      git fetch --quiet origin "$CI_DEFAULT_BRANCH"
      if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD; then
        echo "Release tag must point to a commit included in $CI_DEFAULT_BRANCH"
        exit 1
      fi

      remote_refs="$(git ls-remote --tags --refs "$CI_REPOSITORY_URL" 'v[0-9]*.[0-9]*.[0-9]*')"
      remote_versions="$(printf '%s\n' "$remote_refs" | awk '{print $2}' | sed 's#refs/tags/v##' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true)"
      all_versions="$(printf '%s\n%s\n' "$remote_versions" "$release_version" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | uniq)"
      highest_version="$(printf '%s\n' "$all_versions" | tail -n 1)"
      highest_minor_version="$(printf '%s\n' "$all_versions" | awk -v minor="$release_minor" 'index($0, minor ".") == 1 { print }' | sort -V | tail -n 1)"

      ghcr_tags="$release_version"
      if [ "$release_version" = "$highest_minor_version" ]; then
        ghcr_tags="$ghcr_tags,$release_minor"
      fi
      if [ "$release_version" = "$highest_version" ]; then
        ghcr_tags="$ghcr_tags,latest"
      fi

      {
        printf 'RELEASE_VERSION=%s\n' "$release_version"
        printf 'RELEASE_MINOR=%s\n' "$release_minor"
        printf 'RELEASE_GHCR_TAGS=%s\n' "$ghcr_tags"
      } > release-tags.env
      echo "Release GHCR tags: $(printf '%s' "$ghcr_tags" | tr ',' ' ')"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - release-tags.env
    reports:
      dotenv: release-tags.env

backend-tests:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-test.txt
    - rm -f backend/.env
    - mkdir -p gl-test-reports
    - for var in $(env | cut -d= -f1 | grep '^OIDC_PROVIDERS__' || true); do unset "$var"; done
    - export OIDC_PROVIDERS="{}"
  script:
    - cd backend
    - PYTHONPATH=. python -m pytest tests -q --junit-xml=../gl-test-reports/backend-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-test-reports/backend-junit.xml
    reports:
      junit: gl-test-reports/backend-junit.xml

backend-postgresql-tests:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  needs: []
  variables:
    POSTGRES_DB: bucketreef_bootstrap_test
    POSTGRES_USER: bucketreef
    POSTGRES_PASSWORD: bucketreef-test-password
    DATABASE_URL: postgresql://bucketreef:bucketreef-test-password@postgres:5432/bucketreef_bootstrap_test
    POSTGRES_TEST_DATABASE_URL: postgresql://bucketreef:bucketreef-test-password@postgres:5432/bucketreef_bootstrap_test
    APP_ENV: test
    OIDC_PROVIDERS: "{}"
    LDAP_PROVIDERS: "{}"
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends postgresql-client
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-test.txt
    - rm -f backend/.env
    - mkdir -p gl-test-reports
    - for var in $(env | cut -d= -f1 | grep '^OIDC_PROVIDERS__' || true); do unset "$var"; done
    - for var in $(env | cut -d= -f1 | grep '^LDAP_PROVIDERS__' || true); do unset "$var"; done
    - export OIDC_PROVIDERS="{}"
    - export LDAP_PROVIDERS="{}"
    - until pg_isready --host postgres --username "$POSTGRES_USER" --dbname "$POSTGRES_DB"; do sleep 1; done
  script:
    - cd backend
    - python -m alembic upgrade head
    - PYTHONPATH=. python -m pytest tests_postgresql -q --junit-xml=../gl-test-reports/backend-postgresql-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-test-reports/backend-postgresql-junit.xml
    reports:
      junit: gl-test-reports/backend-postgresql-junit.xml

backend-deadcode:
  stage: test
  image: python:3.12-slim
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-test.txt
  script:
    - cd backend
    - python scripts/check_vulture.py

backend-vuln-scan:
  extends: .trivy-job
  stage: test
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  script:
    - |
      trivy fs \
        --scanners vuln \
        --exit-code 1 \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --format json \
        --output gl-security-reports/backend-dependencies-trivy.json \
        backend || scan_exit=$?
    - trivy fs --scanners vuln --format cyclonedx --output gl-security-reports/backend-sbom.cdx.json backend
    - |
      trivy fs \
        --scanners vuln \
        --severity "$TRIVY_SEVERITY" \
        --ignore-unfixed \
        --ignorefile .trivyignore \
        --timeout "$TRIVY_TIMEOUT" \
        $TRIVY_NO_PROGRESS \
        --format table \
        backend
    - test -z "${scan_exit:-}"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gl-security-reports/backend-dependencies-trivy.json
      - gl-security-reports/backend-sbom.cdx.json

frontend-quality:
  stage: test
  image: node:20
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: never
    - when: on_success
  script:
    - cd frontend
    - npm ci
    - npm audit --omit=dev --audit-level=high
    - npm run check:ci

frontend-tests:
  stage: test
  image: node:20
  needs: []
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true"'
      when: never
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

name: bucketreef

services:
  backend:
    build:
      context: backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      UI_JWT_KEYS: '${UI_JWT_KEYS:-["change-me"]}'
      API_JWT_KEYS: '${API_JWT_KEYS:-["change-me"]}'
      CREDENTIAL_KEYS: '${CREDENTIAL_KEYS:-["change-me"]}'
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://127.0.0.1:8080", "http://localhost:8080"]}'
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:8080}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      ALLOWED_HOSTS: '${ALLOWED_HOSTS:-["localhost", "127.0.0.1", "backend"]}'
      TRUSTED_PROXY_CIDRS: '${TRUSTED_PROXY_CIDRS:-[]}'
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-false}
      REQUIRE_REGISTERED_S3_LOGIN_ENDPOINTS: ${REQUIRE_REGISTERED_S3_LOGIN_ENDPOINTS:-false}
      SEED_SUPER_ADMIN_MODE: disabled
      DATABASE_URL: sqlite:////data/app.db
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:?INTERNAL_CRON_TOKEN must be set}
      BILLING_DAILY_RETENTION_DAYS: ${BILLING_DAILY_RETENTION_DAYS:-365}
      QUOTA_HISTORY_HOURLY_RETENTION_DAYS: ${QUOTA_HISTORY_HOURLY_RETENTION_DAYS:-30}
      QUOTA_HISTORY_DAILY_RETENTION_DAYS: ${QUOTA_HISTORY_DAILY_RETENTION_DAYS:-365}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - backend-data:/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend
    environment:
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-"'self'"}
  scheduler:
    image: alpine:3.20
    depends_on:
      - backend
    environment:
      BACKEND_API_BASE: ${BACKEND_API_BASE:-http://backend:8000/api}
      INTERNAL_CRON_TOKEN: ${INTERNAL_CRON_TOKEN:?INTERNAL_CRON_TOKEN must be set}
      HEALTHCHECK_CRON_SCHEDULE: ${HEALTHCHECK_CRON_SCHEDULE:-*/5 * * * *}
      BILLING_CRON_SCHEDULE: ${BILLING_CRON_SCHEDULE:-0 2 * * *}
      QUOTA_MONITOR_CRON_SCHEDULE: ${QUOTA_MONITOR_CRON_SCHEDULE:-0 * * * *}
      USAGE_HISTORY_CRON_SCHEDULE: ${USAGE_HISTORY_CRON_SCHEDULE:-0 3 * * *}
      BILLING_DAY_OFFSET: ${BILLING_DAY_OFFSET:-1}
      CRON_HTTP_TIMEOUT_SECONDS: ${CRON_HTTP_TIMEOUT_SECONDS:-30}
      SCHEDULER_RUNTIME_ENV_FILE: /tmp/bucketreef-scheduler.env
      TZ: ${TZ:-UTC}
    volumes:
      - ./ops/cron:/opt/cron:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache curl coreutils tzdata
        printf 'BACKEND_API_BASE=%s\nINTERNAL_CRON_TOKEN=%s\nBILLING_DAY_OFFSET=%s\nCRON_HTTP_TIMEOUT_SECONDS=%s\n' "$$BACKEND_API_BASE" "$$INTERNAL_CRON_TOKEN" "$$BILLING_DAY_OFFSET" "$$CRON_HTTP_TIMEOUT_SECONDS" > "$$SCHEDULER_RUNTIME_ENV_FILE"
        {
          echo 'SHELL=/bin/sh'
          echo 'PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'
          echo "$$HEALTHCHECK_CRON_SCHEDULE /bin/sh /opt/cron/run-healthcheck.sh >> /proc/1/fd/1 2>&1"
          echo "$$BILLING_CRON_SCHEDULE /bin/sh /opt/cron/run-billing.sh >> /proc/1/fd/1 2>&1"
          echo "$$QUOTA_MONITOR_CRON_SCHEDULE /bin/sh /opt/cron/run-quota-monitor.sh >> /proc/1/fd/1 2>&1"
          echo "$$USAGE_HISTORY_CRON_SCHEDULE /bin/sh /opt/cron/run-usage-history.sh >> /proc/1/fd/1 2>&1"
        } > /etc/crontabs/root
        exec crond -f -l 8

volumes:
  backend-data:
